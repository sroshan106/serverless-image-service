AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Image upload and storage service

Parameters:
  PublicS3Endpoint:
    Type: String
    Default: ""
    Description: Host used in presigned URLs. Empty on AWS. LocalStack URL for local.
  AllowedOrigin:
    Type: String
    MinLength: 1
    Description: CORS origin for the browser UI. "*" locally; an explicit origin such as https://app.example.com in prod.
  TrustUserHeader:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Accept the X-User-Id header as identity. "true" only on LocalStack; prod needs an authorizer.

Conditions:
  IsAws: !Equals [!Ref PublicS3Endpoint, ""]

Globals:
  Api:
    # Preflight only. Lambda responses add Access-Control-Allow-Origin themselves (http.response).
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-User-Id'"
      AllowOrigin: !Sub "'${AllowedOrigin}'"
    # Errors API Gateway produces itself (before Lambda runs) need the header too, or browsers hide them.
    GatewayResponses:
      DEFAULT_4XX:
        ResponseParameters:
          Headers:
            Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      DEFAULT_5XX:
        ResponseParameters:
          Headers:
            Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
    # Stage wide cap so one client cannot use up the account's request and Lambda concurrency limits.
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingRateLimit: 500
        ThrottlingBurstLimit: 1000
  Function:
    Runtime: python3.12
    CodeUri: src/
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ImagesTable
        # Built with Sub (not Ref) so functions do not depend on the bucket; avoids a circular dependency with the S3 event.
        BUCKET_NAME: !Sub "${AWS::StackName}-images-${AWS::AccountId}"
        PUBLIC_S3_ENDPOINT: !Ref PublicS3Endpoint
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        TRUST_USER_HEADER: !Ref TrustUserHeader
        LOG_LEVEL: INFO

Resources:
  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsAws, true, false]
      DeletionProtectionEnabled: !If [IsAws, true, false]

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-images-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Browser UI: presigned POST upload and fetch of presigned GET URLs.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # AWS only: LocalStack is plain HTTP.
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsAws
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ImagesBucket.Arn, !Sub "${ImagesBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  CreateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image_service.handlers.create_image
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt ImagesTable.Arn
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-images-${AWS::AccountId}/images/*"
      Events:
        Api: { Type: Api, Properties: { Path: /images, Method: post } }

  ListImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image_service.handlers.list_images
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: [!GetAtt ImagesTable.Arn, !Sub "${ImagesTable.Arn}/index/*"]
      Events:
        Api: { Type: Api, Properties: { Path: /images, Method: get } }

  GetImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image_service.handlers.get_image
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt ImagesTable.Arn
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-images-${AWS::AccountId}/images/*"
      Events:
        Api: { Type: Api, Properties: { Path: "/images/{image_id}", Method: get } }

  DownloadImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image_service.handlers.download_image
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt ImagesTable.Arn
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-images-${AWS::AccountId}/images/*"
      Events:
        Api: { Type: Api, Properties: { Path: "/images/{image_id}/download", Method: get } }

  DeleteImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image_service.handlers.delete_image
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !GetAtt ImagesTable.Arn
            - Effect: Allow
              Action: [s3:DeleteObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-images-${AWS::AccountId}/images/*"
      Events:
        Api: { Type: Api, Properties: { Path: "/images/{image_id}", Method: delete } }

  ProcessUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image_service.handlers.process_upload
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt ImagesTable.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-images-${AWS::AccountId}/images/*"
            # ListBucket makes a missing object a 404 (handled) rather than a 403.
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-images-${AWS::AccountId}"
      # Events that still fail after retries land in an SQS queue for redrive, instead of being dropped.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
      Events:
        Uploaded:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: images/ }

Outputs:
  ApiId:
    Value: !Ref ServerlessRestApi
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
  TableName:
    Value: !Ref ImagesTable
  BucketName:
    Value: !Ref ImagesBucket
